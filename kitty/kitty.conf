# ╔══════════════════════════════════════════════════════╗
# ║   kitty.conf — 2B · YoRHa No.2 Type B · NieR:Automata ║
# ║   preto profundo · osso/branco · bronze-dourado       ║
# ╚══════════════════════════════════════════════════════╝

# ── Font ─────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

# ── Cursor ───────────────────────────────────────────────
# Bronze-dourado — fivelas e cabo da espada
cursor                     #c9a876
cursor_text_color          #0a0a0b
cursor_shape               block
cursor_blink_interval      0.4
cursor_stop_blinking_after 0

# ── Scrollback ───────────────────────────────────────────
scrollback_lines           5000

# ── Mouse ────────────────────────────────────────────────
mouse_hide_wait            2.0
focus_follows_mouse        no

# ── Performance ──────────────────────────────────────────
repaint_delay              10
input_delay                3
sync_to_monitor            yes

# ── Bell ─────────────────────────────────────────────────
enable_audio_bell          no
visual_bell_duration       0.0

# ── Window ───────────────────────────────────────────────
remember_window_size       yes
initial_window_width       120c
initial_window_height      34c
window_padding_width       14
window_border_width        2px
draw_minimal_borders       yes
active_border_color        #c9a876
inactive_border_color      #1c1c1e
placement_strategy         center
hide_window_decorations    no
background_opacity         0.96

# ── Tab bar ──────────────────────────────────────────────
tab_bar_edge               bottom
tab_bar_style              powerline
tab_powerline_style        slanted
tab_title_template         " {index}: {title} "
active_tab_font_style      bold
inactive_tab_font_style    normal

# ── Cores principais ─────────────────────────────────────
# Paleta inspirada em 2B (NieR: Automata):
#   #0a0a0b → preto profundo — vestido / fundo
#   #c9a876 → bronze-dourado — fivelas, cabo da espada
#   #e0c08f → dourado claro — brilho metálico
#   #f0ece4 → branco-osso — cabelo prateado
#   #5a6270 → cinza-aço — lâmina da espada
#   #6b2323 → vermelho vinho — vendas dos olhos (uso pontual)

background              #0a0a0b
foreground              #d8d2c6

selection_background    #232326
selection_foreground    #f0ece4

url_color               #c9a876
url_style               curly

# ── Paleta 16 cores ──────────────────────────────────────

# Pretos — preto profundo do vestido
color0   #0a0a0b
color8   #4a4a4d

# Vermelhos — vinho da venda dos olhos
color1   #6b2323
color9   #9c3a3a

# Verdes — oliva-bronze abafado (substitui verde puro)
color2   #6f6b3a
color10  #948a4a

# Amarelos — bronze-dourado principal
color3   #c9a876
color11  #e0c08f

# Azuis — cinza-aço da lâmina
color4   #5a6270
color12  #7d8896

# Magentas — malva suave, uso discreto
color5   #8a7a8c
color13  #ab98ab

# Cianos — cinza-sálvia pálido
color6   #8c9a94
color14  #aebab5

# Brancos — branco-osso do cabelo
color7   #cfc9c0
color15  #f0ece4

# Tab bar
active_tab_background   #232326
active_tab_foreground   #e0c08f
inactive_tab_background #0f0f10
inactive_tab_foreground #6a6a6d
tab_bar_background      #0a0a0b

# ── Keybindings ──────────────────────────────────────────
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+w      close_tab
map ctrl+shift+right  next_tab
map ctrl+shift+left   previous_tab
map ctrl+shift+enter  new_window_with_cwd
map ctrl+equal        change_font_size all +1.0
map ctrl+minus        change_font_size all -1.0
map ctrl+0            change_font_size all 0

# ── Shell integration ─────────────────────────────────────
shell_integration      enabled

# ── Misc ─────────────────────────────────────────────────
close_on_child_death   no
allow_remote_control   yes
term                   xterm-kitty
