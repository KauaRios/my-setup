# ╔══════════════════════════════════════════════════════╗
# ║   kitty.conf — MATRIX // ROOT ACCESS                  ║
# ║   preto absoluto · verde terminal · glow hacker        ║
# ╚══════════════════════════════════════════════════════╝

# ── Font ─────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

# ── Cursor ───────────────────────────────────────────────
# Verde neon puro — cursor "terminal ativo"
cursor                     #00FF41
cursor_text_color          #000000
cursor_shape               block
cursor_blink_interval      0.4
cursor_stop_blinking_after 0

# ── Scrollback ───────────────────────────────────────────
scrollback_lines           5000

# ── Mouse ────────────────────────────────────────────────
mouse_hide_wait            2.0
focus_follows_mouse        no

# ── Performance ──────────────────────────────────────────
repaint_delay              10
input_delay                3
sync_to_monitor            yes

# ── Bell ─────────────────────────────────────────────────
enable_audio_bell          no
visual_bell_duration       0.0

# ── Window ───────────────────────────────────────────────
remember_window_size       yes
initial_window_width       120c
initial_window_height      34c
window_padding_width       14
window_border_width        2px
draw_minimal_borders       yes
active_border_color        #00FF41
inactive_border_color      #0d0d0d
placement_strategy         center
hide_window_decorations    no
background_opacity         0.94

# ── Tab bar ──────────────────────────────────────────────
tab_bar_edge               bottom
tab_bar_style              powerline
tab_powerline_style        slanted
tab_title_template         " {index}: {title} "
active_tab_font_style      bold
inactive_tab_font_style    normal

# ── Cores principais ─────────────────────────────────────
# Paleta MATRIX / hacker terminal:
#   #000000 → preto absoluto — fundo do terminal
#   #00FF41 → verde matrix — texto principal, glow
#   #00b82e → verde escuro — sombras, elementos secundários
#   #5fff8f → verde claro — realces, negrito
#   #003b0f → verde quase-preto — seleção, contraste sutil

background              #000000
foreground              #00FF41

selection_background    #0d3b1a
selection_foreground    #00FF41

url_color               #5fff8f
url_style               curly

# ── Paleta 16 cores ──────────────────────────────────────

# Pretos — fundo absoluto do terminal
color0   #000000
color8   #1a1a1a

# Vermelhos — alerta / erro (uso pontual, contraste com o verde)
color1   #ff2d2d
color9   #ff5f5f

# Verdes — matrix, cor de assinatura do tema
color2   #00b82e
color10  #00FF41

# Amarelos — warnings, destaque secundário
color3   #b8ff00
color11  #d4ff5f

# Azuis — cyan-terminal frio, contraste com o verde
color4   #00b8b8
color12  #5fffff

# Magentas — uso raro, tom "glitch"
color5   #ff00ff
color13  #ff5fff

# Cianos — verde-água, variação da paleta matrix
color6   #00ffb8
color14  #5fffd4

# Brancos — texto de alto contraste
color7   #c0f5c8
color15  #eaffea

# Tab bar
active_tab_background   #0d3b1a
active_tab_foreground   #00FF41
inactive_tab_background #050505
inactive_tab_foreground #1f6b31
tab_bar_background      #000000

# ── Keybindings ──────────────────────────────────────────
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+w      close_tab
map ctrl+shift+right  next_tab
map ctrl+shift+left   previous_tab
map ctrl+shift+enter  new_window_with_cwd
map ctrl+equal        change_font_size all +1.0
map ctrl+minus        change_font_size all -1.0
map ctrl+0            change_font_size all 0

# ── Shell integration ─────────────────────────────────────
shell_integration      enabled

# ── Misc ─────────────────────────────────────────────────
close_on_child_death   no
allow_remote_control   yes
term                   xterm-kitty
